# Loaded alongside the existing staging vhosts. No staging routes are replaced.
server {
    listen 8080;
    server_name 123serve.de www.123serve.de api.123serve.de;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    server_name www.123serve.de;
    ssl_certificate /etc/letsencrypt/live/flowgastronomie-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowgastronomie-public/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    return 308 https://123serve.de$request_uri;
}

server {
    listen 8443 ssl;
    server_name 123serve.de;
    ssl_certificate /etc/letsencrypt/live/flowgastronomie-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowgastronomie-public/privkey.pem;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    location / {
        proxy_pass http://production-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}

server {
    listen 8443 ssl;
    server_name api.123serve.de;
    ssl_certificate /etc/letsencrypt/live/flowgastronomie-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flowgastronomie-public/privkey.pem;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://production-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        gzip off;
    }
}
